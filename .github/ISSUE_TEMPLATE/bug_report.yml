name: Relatar um problema
description: Algo não funcionou como esperado no Polaroid Editor.
body:
  - type: input
    id: version
    attributes:
      label: Versão do Polaroid Editor
      placeholder: Ex. 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Descreva os passos, o resultado esperado e o que aconteceu. Use imagens de demonstração, sem fotografias de clientes.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Versão do Windows, navegador e tipo de instalação (instalada ou portátil).
