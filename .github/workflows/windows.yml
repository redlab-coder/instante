name: Windows · testes e versões
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Instalar dependências de compilação e teste
        run: python -m pip install -r requirements-build.txt playwright==1.59.0
      - name: Testar processamento, API, memória e atualizador
        run: python -m unittest discover -s tests -v
      - name: Preparar compilador do instalador
        run: ./scripts/bootstrap_inno.ps1
      - name: Compilar aplicativo e instalador
        run: python scripts/build_windows.py
      - name: Verificar EXE e navegador
        run: python tests/packaged_check.py dist/PolaroidEditor-Portable.exe
      - name: Verificar instalação e atualização ao encerrar
        run: python tests/installer_check.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PolaroidEditor-Windows-${{ github.run_number }}
          path: |
            dist/PolaroidEditor-Setup-*.exe
            dist/PolaroidEditor-Portable.exe
            dist/update.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Baixar os arquivos já testados
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --name PolaroidEditor-Windows-${{ github.run_number }} --dir dist
      - name: Publicar versão completa
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'from version import VERSION; print(VERSION)')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo 'A tag deve coincidir com version.py' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Polaroid Editor $version" --notes-file RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" "dist/PolaroidEditor-Setup-$version.exe" dist/PolaroidEditor-Portable.exe dist/update.json dist/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
